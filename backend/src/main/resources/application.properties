spring.application.name=tripplanner

# Database Configuration (Defaults to H2 for local, overridden via ENV on Render)
spring.h2.console.enabled=false
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:tripplannerdb}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:default_secure_password_do_not_use_in_prod}

# JPA Configuration
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# ⚡ Bolt Performance Optimization:
# Enabled HTTP response compression for JSON payloads.
# This reduces the size of the payload sent over the network, leading to faster response times,
# particularly for clients with slower network connections, improving overall application responsiveness.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# ⚡ Bolt Performance Optimization:
# Disabled OSIV (Open Session In View) to prevent database connections from being held open
# during JSON serialization and network response. This releases connections immediately
# after the service layer completes, drastically improving connection pool efficiency and throughput.
spring.jpa.open-in-view=false

# CORS Configuration (Overridden via ENV on Render to frontend URL)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
