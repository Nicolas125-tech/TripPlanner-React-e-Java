# Spring Profile specifically for Render deployment

# Dynamically construct the JDBC URL using individual components provided by Render Blueprint
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# JPA Configuration for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Optional: Add HikariCP specific configuration if needed for connections
spring.datasource.hikari.maximum-pool-size=10
