services:
  - type: web
    name: tripplanner-backend
    env: docker
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: tripplanner-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tripplanner-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tripplanner-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tripplanner-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tripplanner-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "*" # Allow all temporarily to avoid circular dependency in Blueprint. Can be updated manually later.

  - type: web
    name: tripplanner-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tripplanner-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: tripplanner-db
    databaseName: tripplanner_db
    user: tripplanner_user
    plan: free
    region: oregon
