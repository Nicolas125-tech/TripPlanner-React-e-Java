services:
  - type: web
    name: tripplanner-backend
    env: docker
    region: oregon
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: DB_HOST
        fromDatabase:
          name: tripplanner-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tripplanner-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tripplanner-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: tripplanner-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tripplanner-db
          property: password
      - key: APP_CORS_ALLOWED_ORIGINS
        value: "https://tripplanner-frontend-mmo8.onrender.com"

  - type: web
    name: tripplanner-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: "https://tripplanner-backend-653v.onrender.com"

databases:
  - name: tripplanner-db
    databaseName: tripplanner_db_l61b
    user: tripplanner_db_l61b_user
    plan: free
    region: oregon
